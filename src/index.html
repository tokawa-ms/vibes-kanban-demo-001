<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カンバンタスク管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'priority-high': '#ef4444',
                        'priority-medium': '#f59e0b',
                        'priority-low': '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <!-- Header -->
    <header class="bg-white shadow-sm rounded-lg p-6 mb-6">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h1 class="text-3xl font-bold text-gray-800">📋 カンバンタスク管理</h1>
            
            <!-- Control Panel -->
            <div class="flex flex-col sm:flex-row gap-4">
                <!-- Search -->
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="タスクを検索..." 
                        class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent w-full sm:w-64"
                    >
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
                
                <!-- Filter and Sort -->
                <div class="flex gap-2">
                    <select id="statusFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="all">全てのステータス</option>
                        <option value="todo">未着手</option>
                        <option value="progress">進行中</option>
                        <option value="done">完了</option>
                    </select>
                    
                    <select id="sortBy" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="updatedAt">更新日時順</option>
                        <option value="createdAt">作成日時順</option>
                        <option value="priority">優先度順</option>
                    </select>
                </div>
                
                <!-- Add Task Button -->
                <button 
                    id="addTaskBtn" 
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-2 whitespace-nowrap"
                >
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    新しいタスク
                </button>
            </div>
        </div>
    </header>

    <!-- Kanban Board -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <!-- Todo Column -->
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                    <div class="w-3 h-3 bg-gray-400 rounded-full"></div>
                    未着手
                    <span id="todoCount" class="bg-gray-100 text-gray-600 px-2 py-1 rounded-full text-sm">0</span>
                </h2>
            </div>
            <div id="todoColumn" class="min-h-96 space-y-3" data-status="todo">
                <!-- Tasks will be inserted here -->
            </div>
        </div>

        <!-- In Progress Column -->
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                    <div class="w-3 h-3 bg-blue-400 rounded-full"></div>
                    進行中
                    <span id="progressCount" class="bg-blue-100 text-blue-600 px-2 py-1 rounded-full text-sm">0</span>
                </h2>
            </div>
            <div id="progressColumn" class="min-h-96 space-y-3" data-status="progress">
                <!-- Tasks will be inserted here -->
            </div>
        </div>

        <!-- Done Column -->
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                    <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                    完了
                    <span id="doneCount" class="bg-green-100 text-green-600 px-2 py-1 rounded-full text-sm">0</span>
                </h2>
            </div>
            <div id="doneColumn" class="min-h-96 space-y-3" data-status="done">
                <!-- Tasks will be inserted here -->
            </div>
        </div>
    </main>

    <!-- Archive Section -->
    <div class="bg-white rounded-lg shadow-sm p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold text-gray-700 flex items-center gap-2">
                <svg class="h-6 w-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8l6 6 6-6"></path>
                </svg>
                アーカイブ
                <span id="archiveCount" class="bg-gray-100 text-gray-600 px-2 py-1 rounded-full text-sm">0</span>
            </h2>
            <button id="toggleArchive" class="text-gray-500 hover:text-gray-700 transition-colors">
                <span id="archiveToggleText">表示</span>
            </button>
        </div>
        <div id="archiveSection" class="hidden">
            <div id="archiveContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Archived tasks will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden" style="display: none;">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modalTitle" class="text-lg font-semibold text-gray-800">新しいタスク</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="taskForm">
                <div class="space-y-4">
                    <div>
                        <label for="taskTitle" class="block text-sm font-medium text-gray-700 mb-1">タイトル</label>
                        <input 
                            type="text" 
                            id="taskTitle" 
                            required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="タスクのタイトルを入力..."
                        >
                    </div>
                    
                    <div>
                        <label for="taskDescription" class="block text-sm font-medium text-gray-700 mb-1">説明</label>
                        <textarea 
                            id="taskDescription" 
                            rows="3" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="タスクの説明を入力..."
                        ></textarea>
                    </div>
                    
                    <div>
                        <label for="taskPriority" class="block text-sm font-medium text-gray-700 mb-1">優先度</label>
                        <select id="taskPriority" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    
                    <div class="flex gap-3 pt-4">
                        <button 
                            type="submit" 
                            class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg transition-colors"
                        >
                            保存
                        </button>
                        <button 
                            type="button" 
                            id="cancelModal" 
                            class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 px-4 rounded-lg transition-colors"
                        >
                            キャンセル
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
